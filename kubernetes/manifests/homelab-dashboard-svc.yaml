apiVersion: v1
kind: Service
metadata:
  name: homelab-dashboard
  namespace: homelab
  labels:
    app: homelab-dashboard
spec:
  type: NodePort
  selector:
    app: homelab-dashboard
  ports:
    - name: http
      port: 80
      targetPort: 80
      # Reachable on any node over Tailscale, e.g.
      # http://100.106.110.55:30080  (Dell 7440 - control plane)
      # http://100.108.102.105:30080 (Dell 5070)
      # http://100.117.229.28:30080  (Dell 7050)
      nodePort: 30080
